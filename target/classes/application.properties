server.port=8080

# ---- Database (H2 file DB: zero setup, data survives restarts) ----
spring.datasource.url=jdbc:h2:file:./data/resumedb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# ---- Upload limits ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# ---- FastAPI server (model lives here later) ----
fastapi.base-url=http://localhost:8000

# ---- To use MySQL instead, replace the datasource lines with: ----
# spring.datasource.url=jdbc:mysql://localhost:3306/resumedb
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# (and swap the h2 dependency for mysql-connector-j in pom.xml)