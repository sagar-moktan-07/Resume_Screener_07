server.port=8080

# ---- PostgreSQL (database resumedb, role resume_app) ----
# Override with SPRING_DATASOURCE_URL / USERNAME / PASSWORD if needed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/resumedb?gssEncMode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:resume_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:resume_app}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Tables come from src/main/resources/db/schema.sql (already loaded in resumedb).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Upload limits ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# ---- FastAPI server (model lives here later) ----
fastapi.base-url=http://localhost:8000

# ---- Default admin (created ONLY the first time the app starts) ----
app.admin.username=admin
app.admin.email=sagarmoktan2369@gmal.com
app.admin.password=${ADMIN_PASSWORD:moktan07}

# ---- Session cookie: not sent on cross-site requests (CSRF mitigation) ----
server.servlet.session.cookie.same-site=lax
