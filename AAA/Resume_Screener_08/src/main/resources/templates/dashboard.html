<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resume Screener Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 24px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        h2 { margin-top: 0; }
        label { display: block; margin: 10px 0 6px; }
        input, textarea, select, button { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #0b1220; color: white; }
        textarea { min-height: 90px; }
        button { margin-top: 14px; background: #60a5fa; color: #0f172a; font-weight: 700; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #334155; padding: 8px; text-align: left; }
        .muted { color: #cbd5e1; }
    </style>
</head>
<body>
<div class="container">
    <h1>Resume Screener Dashboard</h1>

    <div class="grid">
        <div class="panel">
            <h2>Create Vacancy</h2>
            <form th:action="@{/vacancies}" th:object="${newVacancy}" method="post">
                <label>Job title</label>
                <input th:field="*{jobTitle}" placeholder="Senior Backend Developer" />

                <label>Department</label>
                <input th:field="*{department}" placeholder="Engineering" />

                <label>Job description</label>
                <textarea th:field="*{jobDescription}" placeholder="Describe the role"></textarea>

                <label>Required skills</label>
                <textarea th:field="*{requiredSkills}" placeholder="Python, FastAPI, PostgreSQL"></textarea>

                <label>Preferred skills</label>
                <textarea th:field="*{preferredSkills}" placeholder="AWS, Docker, Redis"></textarea>

                <label>Qualifications</label>
                <textarea th:field="*{qualifications}" placeholder="Bachelor degree in CS"></textarea>

                <button type="submit">Save Vacancy</button>
            </form>
        </div>

        <div class="panel">
            <h2>Upload Resumes</h2>
            <form th:action="@{/upload}" method="post" enctype="multipart/form-data">
                <input type="file" name="files" multiple accept="application/pdf" />
                <button type="submit">Upload & Extract</button>
            </form>
            <hr>
            <h3>Vacancies</h3>
            <div th:if="${#lists.isEmpty(vacancies)}" class="muted">No vacancies yet.</div>
            <div th:each="vacancy : ${vacancies}">
                <form th:action="@{/screen}" method="post">
                    <input type="hidden" name="vacancyId" th:value="${vacancy.id}" />
                    <p><strong th:text="${vacancy.jobTitle}"></strong></p>
                    <button type="submit">Run Screening</button>
                </form>
            </div>
        </div>
    </div>

    <div class="panel" style="margin-top: 30px;">
        <h2>Candidates</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Skills</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="candidate : ${candidates}">
                <td th:text="${candidate.id}"></td>
                <td th:text="${candidate.fullName}"></td>
                <td th:text="${candidate.email}"></td>
                <td th:text="${candidate.phone}"></td>
                <td th:text="${candidate.skills}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
