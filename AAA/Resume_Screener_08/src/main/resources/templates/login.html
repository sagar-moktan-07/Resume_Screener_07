<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resume Screener Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0d1b2a; color: #e5eefb; display: grid; place-items: center; height: 100vh; margin: 0; }
        .card { background: #1b263b; padding: 32px; border-radius: 12px; width: 360px; box-shadow: 0 10px 28px rgba(0,0,0,0.35); }
        h1 { margin-top: 0; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #3a4c68; background: #0f172a; color: white; }
        button { margin-top: 18px; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; background: #64b5f6; color: #0d1b2a; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h1>Resume Screener</h1>
    <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" value="admin" />

        <label for="password">Password</label>
        <input id="password" type="password" name="password" value="admin123" />

        <button type="submit">Log in</button>
    </form>
</div>
</body>
</html>
