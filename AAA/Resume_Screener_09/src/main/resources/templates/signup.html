<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Screener Signup</title>
    <style>
        :root {
            --bg-1: #f4f7ff;
            --bg-2: #eef3ff;
            --bg-3: #e9f4ff;
            --panel: rgba(255, 255, 255, 0.88);
            --primary: #4f46e5;
            --primary-strong: #3730a3;
            --primary-soft: #eef2ff;
            --text: #1f2937;
            --muted: #5d6b82;
            --border: #dfe7ff;
            --danger: #d14343;
            --success: #198754;
            --shadow: 0 25px 60px rgba(79, 70, 229, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 22%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
            color: var(--text);
        }
        .signup-card {
            position: relative;
            width: min(480px, 92vw);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 30px 28px 24px;
            backdrop-filter: blur(10px);
        }
        .signup-card::before {
            content: "";
            position: absolute;
            inset: 0 auto auto 0;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.10), rgba(96, 165, 250, 0.05));
            border-radius: 0 0 100% 0;
            pointer-events: none;
        }
        h1 {
            position: relative;
            margin: 0 0 8px;
            font-size: 2.1rem;
            letter-spacing: -0.06em;
        }
        .subtitle {
            position: relative;
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.55;
        }
        .alert {
            position: relative;
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #fff1f2;
            color: var(--danger);
            border: 1px solid #f5c6c7;
            font-size: 0.93rem;
            font-weight: 600;
        }
        form {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.92rem;
            font-weight: 700;
        }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255,255,255,0.78);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: rgba(79, 70, 229, 0.72);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
            transform: translateY(-1px);
        }
        button {
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: white;
            border-radius: 12px;
            padding: 13px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 22px rgba(79, 70, 229, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 28px rgba(79, 70, 229, 0.25);
        }
        .footer {
            position: relative;
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
        }
        .footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <h1>Create account</h1>
        <p class="subtitle">Sign up with your name, username, email, and password.</p>

        <div th:if="${signupError}" class="alert" th:text="${signupError}">Validation failed.</div>

        <form th:action="@{/signup}" th:object="${user}" method="post">
            <label>
                Name
                <input type="text" th:field="*{name}" placeholder="Your full name" required>
            </label>

            <label>
                Username
                <input type="text" th:field="*{username}" placeholder="Your username" required>
            </label>

            <label>
                Email
                <input type="email" th:field="*{email}" placeholder="you@example.com" required>
            </label>

            <label>
                Password
                <input type="password" th:field="*{password}" placeholder="Create a password" required>
            </label>

            <button type="submit">Create account</button>
        </form>

        <div class="footer">
            Already have an account?
            <a th:href="@{/login}">Login</a>
        </div>
    </div>
</body>
</html>
