<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage users</title>
    <style>
        :root {
            --bg: #f7fafc;
            --panel: #ffffff;
            --muted: #6b7280;
            --text: #0f1724;
            --border: #e6eef9;
            --primary: #0b76ef;
            --danger: #dc2626;
            --shadow-subtle: 0 6px 18px rgba(15, 23, 36, 0.06);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, 'Segoe UI', system-ui, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h1 { margin: 0; font-size: 1.4rem; }
        .nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .button-link {
            text-decoration: none;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700;
        }
        main { max-width: 980px; margin: 32px auto; padding: 0 16px 40px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: var(--shadow-subtle);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        th { color: var(--muted); }
        .danger-btn {
            background: #fdecec;
            border: 1px solid #f7b3b3;
            color: var(--danger);
            border-radius: 10px;
            padding: 8px 10px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Users</h1>
        <div class="nav">
            <a class="button-link" href="/dashboard">Back to dashboard</a>
            <a class="button-link" href="/admin/finalized">Finalized candidates</a>
            <a class="button-link" href="/logout">Logout</a>
        </div>
    </header>

    <main>
        <div class="card">
            <h2>Registered users</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.name}">User</td>
                        <td th:text="${user.username}">username</td>
                        <td th:text="${user.email}">user@example.com</td>
                        <td>
                            <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" onsubmit="return confirm('Remove this user?');">
                                <button type="submit" class="danger-btn">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
