# Tests use in-memory H2 so they do not need a running PostgreSQL server.
spring.datasource.url=jdbc:h2:mem:resumedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
app.admin.username=admin
app.admin.email=admin@example.com
app.admin.password=test-password
fastapi.base-url=http://localhost:8000
