<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Screener</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header>
        <h2>Resume Screener</h2>
        <span id="who"></span>
        <a href="/admin.html" id="adminLink" style="display:none">Admin Panel</a>
        <form method="post" action="/logout"><button class="btn btn-small">Logout</button></form>
    </header>

    <main>
        <div class="card">
            <h3>Upload Resumes</h3>
            <input type="file" id="files" accept="application/pdf" multiple>
            <button class="btn" id="uploadBtn" style="margin-left:8px">Upload &amp; Extract</button>
            <p id="status"></p>
        </div>

        <div class="card">
            <h3>Candidates</h3>
            <div class="wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th>
                            <th>Qualifications</th><th>Skills</th><th>Experience</th><th>File</th>
                            <th id="actionsHeader" style="display:none">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const statusEl = document.getElementById('status');
        const rowsEl = document.getElementById('rows');
        const btn = document.getElementById('uploadBtn');
        let isAdmin = false;

        // Wrapper: if the session ended, send the user back to the login page
        async function api(url, options) {
            const res = await fetch(url, options);
            if (res.status === 401 || res.redirected) {
                window.location.href = '/login.html';
                throw new Error('Not logged in');
            }
            return res;
        }

        btn.addEventListener('click', upload);

        async function init() {
            const me = await (await api('/api/auth/me')).json();
            document.getElementById('who').textContent = `${me.fullName || me.username} (${me.role})`;

            isAdmin = me.role === 'ADMIN';
            if (isAdmin) {
                // Hiding these is cosmetic only. The server enforces the real rules.
                document.getElementById('adminLink').style.display = 'inline';
                document.getElementById('actionsHeader').style.display = 'table-cell';
            }
            loadCandidates();
        }

        async function upload() {
            const files = document.getElementById('files').files;
            if (!files.length) {
                statusEl.textContent = 'Select at least one PDF.';
                return;
            }

            const form = new FormData();
            for (const f of files) form.append('files', f);

            btn.disabled = true;
            statusEl.textContent = 'Uploading...';

            try {
                const res = await api('/api/resumes/upload', { method: 'POST', body: form });
                if (!res.ok) throw new Error('Server returned ' + res.status);
                const data = await res.json();

                statusEl.textContent =
                    `Stored: ${data.stored} | Failed: ${data.failed} | FastAPI notified: ${data.fastApiNotified ? 'yes' : 'no'}`;
                await loadCandidates();
            } catch (e) {
                statusEl.textContent = 'Error: ' + e.message;
            }
            btn.disabled = false;
        }

        async function loadCandidates() {
            const res = await api('/api/candidates');
            const list = await res.json();
            rowsEl.innerHTML = '';

            for (const c of list) {
                const tr = document.createElement('tr');

                [c.id, c.fullName, c.email, c.phone,
                 c.qualifications, c.skills, c.experience, c.fileName].forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value ?? '';
                    tr.appendChild(td);
                });

                if (isAdmin) {
                    const td = document.createElement('td');
                    const del = document.createElement('button');
                    del.className = 'btn btn-small btn-danger';
                    del.textContent = 'Delete';
                    del.addEventListener('click', async () => {
                        if (!confirm(`Delete candidate "${c.fullName}"?`)) return;
                        await api('/api/candidates/' + c.id, { method: 'DELETE' });
                        loadCandidates();
                    });
                    td.appendChild(del);
                    tr.appendChild(td);
                }
                rowsEl.appendChild(tr);
            }
        }

        init();
    </script>
</body>
</html>
